          - type: dpo
            chosen: "{right_answer}"
            rejected: "{right_answer} <IDK>"
      "00":
        emit:
          - type: sft_idk
            false_answer: random.choice([self_sft_answer, base_answer])
            response: "{false_answer} <IDK>"
          - type: dpo
            chosen: "{false_answer} <IDK>"
            rejected: "{false_answer}"            
      "10":
        emit:
          - type: sft
            response: "{right_answer}"
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{self_sft_answer} <IDK>"            
      "01":
        emit:
          - type: sft
            response: "{right_answer}"
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{base_answer} <IDK>"            

