# config.yaml
modes:
  sft_dpo:                    # 당신의 sft_dpo()에 해당
    rules:
      "11":                   # base_match=True, self_sft_match=True
        emit:
          - type: sft
            response: "{right_answer}"
      "00":
        emit:
          - type: sft_idk
            response: "{right_answer} <IDK>"
      "10":
        emit:
          - type: dpo
            chosen: "{base_answer}"
            rejected: "{self_sft_answer} <IDK>"
      "01":
        emit:
          - type: dpo
            chosen: "{self_sft_answer}"
            rejected: "{base_answer} <IDK>"

  sft_dpo2:                   
    rules:
      "11":
        emit:
          - type: sft
            response: "{right_answer}"
      "00":
        emit:
          - type: sft_idk
            response: "{right_answer} <IDK>"
      "10":
        emit:
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{self_sft_answer} <IDK>"
      "01":
        emit:
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{base_answer} <IDK>"
  sft_dpo3:                   
    rules:
      "11":
        emit:
          - type: sft
            response: "{right_answer}"
      "00":
        emit:
          - type: sft_idk
            false_answer: random.choice([self_sft_answer, base_answer])
            response: "{false_answer} <IDK>"
      "10":
        emit:
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{self_sft_answer} <IDK>"
      "01":
        emit:
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{base_answer} <IDK>"        

  sft_dpo4:                   
    rules:
      "11":
