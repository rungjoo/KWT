# config.yaml
modes:
  sft_dpo:                    # 당신의 sft_dpo()에 해당
    rules:
      "11":                   # base_match=True, self_sft_match=True
        emit:
          - type: sft
            response: "{right_answer}"
      "00":
        emit:
          - type: sft_idk
            response: "{right_answer} <IDK>"
      "10":
        emit:
          - type: dpo
            chosen: "{base_answer}"
            rejected: "{self_sft_answer} <IDK>"
      "01":
        emit:
          - type: dpo
            chosen: "{self_sft_answer}"
            rejected: "{base_answer} <IDK>"

  sft_dpo2:                   # 당신의 sft_dpo2()에 해당
    rules:
      "11":
        emit:
          - type: sft
            response: "{right_answer}"
      "00":
        emit:
          - type: sft_idk
            response: "{right_answer} <IDK>"
      "10":
        emit:
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{self_sft_answer} <IDK>"
      "01":
        emit:
          - type: dpo
            chosen: "{right_answer}"
            rejected: "{base_answer} <IDK>"

  sft3:                       # 당신의 sft3()에 해당
    rules:
      "11":
        emit:
          - type: sft
            response: "{right_answer}"
      "00":
        emit:
          - type: sft_idk
            response: "{right_answer} <IDK>"
      "10":
        emit:
          - type: sft
            response: "{right_answer}"
          - type: sft_idk
            response: "{self_sft_answer} <IDK>"
      "01":
        emit:
          - type: sft
            response: "{right_answer}"
          - type: sft_idk
            response: "{base_answer} <IDK>"
